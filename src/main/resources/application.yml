spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/telegram_pay}
    username: ${DB_USER:telegram}
    password: ${DB_PASSWORD:telegram}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

telegram-pay:
  crypto:
    master-key-base64: ${TELEGRAM_PAY_MASTER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  jobs:
    expire-delay-ms: 60000
    reminder-cron: "0 0 * * * *"

logging:
  level:
    com.example.telegrampay: INFO
